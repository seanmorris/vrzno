name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-bridge:
    name: JS bridge / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    container: emscripten/emsdk:6.0.6
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.5.0']
    steps:
      - name: Check out Vrzno
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install development tools
        run: npm ci

      - name: Check embedded JavaScript style
        run: npm run lint

      - name: Check Make embedding, JS contracts, and bundled weakermap
        run: npm test

  build-and-test:
    name: PHP ${{ matrix.php-version }} / wasm32
    needs: js-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.5']

    steps:
      - name: Check out Vrzno
        uses: actions/checkout@v6
        with:
          path: vrzno

      - name: Use the tested Node runtime for required GC coverage
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Check out the php-wasm integration baseline
        uses: actions/checkout@v6
        with:
          repository: seanmorris/php-wasm
          ref: 40c63851e97f039bf9de7e8abebfb513c3f13fcf
          path: php-wasm

      - name: Configure php-wasm
        working-directory: php-wasm
        run: |
          cp ".circleci/.env_${{ matrix.php-version }}.ci" .env
          npm ci

      - name: Build the Emscripten image
        working-directory: php-wasm
        run: make image

      - name: Build PHP with this Vrzno checkout
        working-directory: php-wasm
        run: >-
          make -j2 node-mjs
          PHP_VERSION=${{ matrix.php-version }}
          WITH_ICONV=0
          WITH_YAML=0
          WITH_VRZNO=1
          VRZNO_DEV_PATH="${GITHUB_WORKSPACE}/vrzno"

      - name: Run the integration regression tests
        working-directory: vrzno
        env:
          PHP_VERSION: ${{ matrix.php-version }}
          PHP_WASM_ROOT: ${{ github.workspace }}/php-wasm
        run: npm run test:integration

      - name: Run the php-wasm Vrzno package tests
        working-directory: php-wasm
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: node --expose-gc --test packages/vrzno/test/*.mjs
